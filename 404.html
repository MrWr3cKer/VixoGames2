  <script>
    (function () {
      const grid = document.getElementById("404-games");
      if (!grid) return;
      fetch("https://feeds.gamepix.com/v2/json?sid=1VXSV&pagination=12&page=1")
        .then(function (r) { return r.json(); })
        .then(function (feed) {
          const items = (feed.items || []).slice(0, 8);
          grid.innerHTML = "";
          items.forEach(function (item) {
            const q = new URLSearchParams();
            if (item.namespace) q.set("game", item.namespace);
            if (item.title) q.set("title", item.title);
            if (item.category) q.set("category", item.category);
            const a = document.createElement("a");
            a.className = "similar-card";
            a.href = item.namespace
              ? "games/" + encodeURIComponent(item.namespace)
              : "index.html";
            a.innerHTML =
              '<div class="similar-card-cover"><img src="' +
              (item.banner_image || item.image || "") +
              '" alt="" loading="lazy" /></div><div class="similar-card-body"><span class="similar-card-title">' +
              (item.title || "Game") +
              "</span></div>";
            grid.appendChild(a);
          });
        })
        .catch(function () {
          grid.innerHTML = "<p>Could not load suggestions. <a href=\"index.html\">Browse home</a>.</p>";
        });
    })();
